# This file is to override properties in the main application.properties without replacing the file.

spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=springboot
spring.mail.password=secret
email.from=test@example.com

jwt.algorithm.key=test-jwt-signing-key-for-isolated-tests

yandex.delivery.api.token=test-token
yandex.delivery.api.platform_id=test-platform
yookassa.shop.id=test-shop
yookassa.secret.key=test-secret
yandex.storage.access-key=test-access-key
yandex.storage.secret-key=test-secret-key
yandex.storage.bucket-name=test-bucket

# Google OAuth2 (для тестов)
spring.security.oauth2.client.registration.google.client-id=test-client-id.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=test-secret