# Trick to let IntelliJ view endpoints through actuator.
management.endpoints.jmx.exposure.include=*

spring.config.import=optional:file:.env[.properties],optional:file:server/.env[.properties]

# Database connection & configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

swagger.server.url=http://localhost:8080

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true

spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

app.upload.dir=${UPLOAD_DIR:/app/uploads/images}
app.upload.web-path=/images/

spring.jpa.hibernate.ddl-auto=update

# Encryption configuration
encryption.salt.rounds=10

yandex.delivery.api.token=${YANDEX_DELIVERY_API_TOKEN}
yandex.delivery.api.url=${YANDEX_DELIVERY_API_URL:https://b2b.taxi.yandex.net}
yandex.delivery.api.platform_id=${YANDEX_DELIVERY_API_PLATFORM_ID}

# Yokassa
yookassa.shop.id=${YOOKASSA_SHOP_ID}
yookassa.secret.key=${YOOKASSA_SECRET_KEY}

# JWT configuration
jwt.algorithm.key=${JWT_ALGORITHM_KEY}
jwt.issuer=${JWT_ISSUER:eCommerce}
jwt.expiryInSeconds=${JWT_EXPIRY_IN_SECONDS:604800}

yandex.storage.access-key=${YANDEX_STORAGE_ACCESS_KEY}
yandex.storage.secret-key=${YANDEX_STORAGE_SECRET_KEY}
yandex.storage.bucket-name=${YANDEX_STORAGE_BUCKET_NAME}

# Email configuration
email.from=${EMAIL_FROM}

# Server (для OAuth за reverse proxy: Spring использует X-Forwarded-Proto, X-Forwarded-Host)
server.forward-headers-strategy=framework

# General configuration
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# Google OAuth2: https://console.cloud.google.com/ -> APIs & Services -> Credentials
# Authorized redirect URI = URL бэкенда + /login/oauth2/code/google
# Например: https://ecommerceapi.baxic.ru/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# SMTP configuration
spring.mail.host=smtp-service
spring.mail.port=1025
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false