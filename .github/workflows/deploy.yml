name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Run server tests
        working-directory: server
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -DfailIfNoTests=true test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Test and build client
        working-directory: client
        env:
          CI: "true"
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: app
            context: server
          - service: client
            context: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment files
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: |
          printf '%s\n' "$SERVER_ENV" > server/.env
          printf '%s\n' "$CLIENT_ENV" > client/.env

      - name: Copy project to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "client,server,deploy,scripts,docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy published images
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_IMAGE: ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          CLIENT_IMAGE: ghcr.io/${{ github.repository }}/client:${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,APP_IMAGE,CLIENT_IMAGE
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            echo "[deploy] $(date -Is) connected on $(hostname)"
            cd "$DEPLOY_PATH"
            export COMPOSE_K3S_LOCK_WAIT="${COMPOSE_K3S_LOCK_WAIT:-300}"
            export COMPOSE_K3S_CLEAR_ORPHAN_LOCK=1
            stdbuf -oL -eL bash "$DEPLOY_PATH/scripts/compose-k3s-sync.sh" \
              --project-dir "$DEPLOY_PATH" \
              --env-file client/.env \
              --patch-only
            k3s kubectl -n e-commerce-java-two set image \
              deployment/e-commerce-java-two-app \
              e-commerce-java-two-app="$APP_IMAGE"
            k3s kubectl -n e-commerce-java-two set image \
              deployment/e-commerce-java-two-client \
              e-commerce-java-two-client="$CLIENT_IMAGE"
            k3s kubectl -n e-commerce-java-two rollout status \
              deployment/e-commerce-java-two-app --timeout=5m
            k3s kubectl -n e-commerce-java-two rollout status \
              deployment/e-commerce-java-two-client --timeout=5m
